<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">SentinelFlow multimodal safety architecture</title>
  <desc id="desc">A dark glassmorphism architecture diagram showing evidence ingestion, temporal intelligence, event policy, and operator experience.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#080B14"/><stop offset="1" stop-color="#16112B"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#34D399"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6"/></marker>
    <style>
      .label{font:600 20px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.small{font:500 14px Inter,Segoe UI,sans-serif;fill:#A5B4FC}.tiny{font:500 12px Inter,Segoe UI,sans-serif;fill:#94A3B8}.box{fill:#111827;fill-opacity:.78;stroke:#334155;stroke-width:1.5}.accent{stroke:url(#violet);stroke-width:2}.line{stroke:#8B5CF6;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="620" rx="36" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="110" fill="#7C3AED" opacity=".18" filter="url(#glow)"/>
  <circle cx="1250" cy="520" r="140" fill="#06B6D4" opacity=".12" filter="url(#glow)"/>
  <text x="72" y="68" class="small" letter-spacing="4">SENTINELFLOW / SYSTEM MAP</text>
  <text x="72" y="108" class="label" font-size="28">Evidence → context → decision → action</text>
  <text x="72" y="138" class="tiny">Public architecture surface · private implementation boundary</text>

  <g filter="url(#shadow)">
    <rect x="64" y="205" width="220" height="132" rx="20" class="box accent"/>
    <text x="88" y="245" class="label">Ingress</text><text x="88" y="274" class="small">RTSP / video</text><text x="88" y="299" class="small">microphone / audio</text>
    <rect x="326" y="178" width="250" height="186" rx="20" class="box accent"/>
    <text x="354" y="220" class="label">Perception</text><text x="354" y="250" class="small">pose evidence</text><text x="354" y="276" class="small">quality guard</text><text x="354" y="302" class="small">world-state tokens</text><text x="354" y="334" class="tiny">stable observation envelope</text>
    <rect x="618" y="178" width="250" height="186" rx="20" class="box accent"/>
    <text x="646" y="220" class="label">Intelligence</text><text x="646" y="250" class="small">temporal reasoning</text><text x="646" y="276" class="small">future warning</text><text x="646" y="302" class="small">gated fusion</text><text x="646" y="334" class="tiny">modality-aware confidence</text>
    <rect x="910" y="205" width="220" height="132" rx="20" class="box accent"/>
    <text x="938" y="245" class="label">Policy</text><text x="938" y="274" class="small">verification</text><text x="938" y="299" class="small">severity + lifecycle</text>
    <rect x="1172" y="178" width="164" height="186" rx="20" class="box" stroke="url(#mint)" stroke-width="2"/>
    <text x="1197" y="220" class="label">Action</text><text x="1197" y="250" class="small">console</text><text x="1197" y="276" class="small">mobile</text><text x="1197" y="302" class="small">audit</text><text x="1197" y="334" class="tiny">human review</text>
  </g>
  <path d="M284 270 H326" class="line"/><path d="M576 270 H618" class="line"/><path d="M868 270 H910" class="line"/><path d="M1130 270 H1172" class="line"/>

  <g>
    <rect x="326" y="430" width="804" height="92" rx="22" fill="#0F172A" stroke="#334155"/>
    <text x="360" y="468" class="small" letter-spacing="2">EVENT LIFECYCLE</text>
    <text x="360" y="500" class="label">OBSERVED</text><text x="535" y="500" class="small">→</text><text x="584" y="500" class="label">VERIFIED</text><text x="770" y="500" class="small">→</text><text x="818" y="500" class="label">ESCALATED</text><text x="1020" y="500" class="small">→</text><text x="1066" y="500" class="label">RESOLVED</text>
  </g>
  <text x="72" y="574" class="tiny">Designed for reviewable safety signals, graceful degradation, and private-by-default operation.</text>
</svg>
